<div class="parent">
  <div class="animated-background">
    <div class="shape shape-1"></div>
    <div class="shape shape-2"></div>
    <div class="shape shape-3"></div>
  </div>

  <div class="container">
    <div class="row justify-content-center align-items-center min-vh-100">
      <div class="col-12 col-md-6 col-lg-5">
        <div class="login-card">
          <div class="card-body">
            <div class="text-center mb-4 fade-in">
              <div class="logo-circle mb-3"></div>
              <h2 class="fw-bold mb-2">Welcome Back</h2>
              <p class="text-muted">Sign in to continue to your account</p>
            </div>

            <form class="fade-in-delay">
              <div class="form-floating mb-3 input-group-custom">
                <input
                  type="email"
                  class="form-control"
                  id="emailInput"
                  placeholder="name@example.com"
                  required
                />
                <label for="emailInput">Email address</label>
              </div>

              <div class="form-floating mb-3 input-group-custom">
                <input
                  type="password"
                  class="form-control"
                  id="passwordInput"
                  placeholder="Password"
                  required
                />
                <label for="passwordInput">Password</label>
              </div>

              <div
                class="d-flex justify-content-between align-items-center mb-4"
              >
                <div class="form-check">
                  <input
                    class="form-check-input"
                    type="checkbox"
                    id="rememberMe"
                  />
                  <label class="form-check-label" for="rememberMe">
                    Remember me
                  </label>
                </div>
                <a href="#">Forgot password?</a>
              </div>

              <button type="submit" class="btn-primary mb-3">
                <span>Sign In</span>
              </button>

              <div class="divider mb-3">
                <span>or continue with</span>
              </div>

              <div class="row g-2 mb-4">
                <div class="col-6">
                  <button type="button" class="social-btn">Google</button>
                </div>
                <div class="col-6">
                  <button type="button" class="social-btn">GitHub</button>
                </div>
              </div>

              <div class="text-center">
                <p class="mb-0 text-muted">
                  Don't have an account?
                  <a href="#">Sign up</a>
                </p>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
